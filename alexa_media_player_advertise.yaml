blueprint:
  name: Alexa Media Player Advertise
  description: Envia um anúncio para a caixa Echo selecionada. / Sends an announcement to the selected Echo box.
  domain: script
  input: {}
  source_url: https://github.com/wesleyRaposo/ha-blueprints/blob/main/alexa_media_player_advertise.yaml
mode: queued
fields:
  mensagem:
    selector:
      text:
    name: Mensagem:
    description: O que será anunciado.
    required: true
    default: Teste    
  onde_anunciar:
    selector:
      entity:
        filter:
        - integration: alexa_media
          domain: media_player
        multiple: true
    name: Onde será anunciado:
    required: true
    default: []
    description: Dispositivo para o qual a mensagem será enviada.
  volume:
    selector:
      number:
        min: 0.1
        max: 1
        step: 0.1
    default: 0.5
    required: true
    name: Volume:
    description: Volume do anúncio (padrão 50%)
sequence:
- action: media_player.volume_set
  metadata: {}
  data:
    volume_level: '{{ volume }}'
  target:
    entity_id: '{{ onde_anunciar }}'
- delay:
    hours: 0
    minutes: 0
    seconds: 1
    milliseconds: 0
- action: notify.alexa_media
  data:
    message: '{{ mensagem }}'
    data:
      type: announce
    target: '{{ onde_anunciar }}'
- delay:
    hours: 0
    minutes: 0
    seconds: 10
    milliseconds: 0
- action: media_player.volume_set
  metadata: {}
  data:
    volume_level: 0.3
  target:
    entity_id: '{{ onde_anunciar }}'
icon: mdi:bullhorn
